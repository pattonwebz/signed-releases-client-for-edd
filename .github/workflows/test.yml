name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run tests
        run: vendor/bin/phpunit

  # WordPress coding standards for the library. The ruleset lives in
  # phpcs.xml.dist and is declared in composer.json's require-dev, so the
  # standard installs with the same `composer install` the test jobs use.
  #
  # This job does not gate yet: adoption surfaced ~128 WordPress-Docs docblock
  # findings on previously unlinted files, and 0 substantive ones (the 10
  # substantive findings were addressed with targeted phpcs:ignore comments
  # rather than ruleset-wide suppressions). Drop continue-on-error once the
  # docblock baseline is emptied, or after deciding to run without
  # WordPress-Docs.
  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist --report=summary
